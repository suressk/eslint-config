name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout code
        uses: actions/checkout@v4

      - name: 🪜 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 🖥️ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 🏗️ Install deps
        run: pnpm i

      - name: 🛠️ LintFix
        run: pnpm run lint:fix
